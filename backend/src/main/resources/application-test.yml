# Test profile: an in-memory database with Flyway disabled.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:returnloop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    listener:
      auto-startup: false

returnloop:
  security:
    jwt:
      secret: test-secret-value-that-is-long-enough-for-hmac-sha-256
  seed:
    enabled: false
  messaging:
    kafka:
      enabled: false

management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
